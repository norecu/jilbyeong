<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>지역별 감염병 발생 — 입체 지형도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.1/build/three.module.js"
  }
}
</script>
</head>
<body>

  <div class="grain"></div>

  <header class="topbar">
    <div class="topbar__title">
      <span class="eyebrow">법정 감염병 · 시도별 신고 현황</span>
      <h1>지형으로 읽는 감염병 지도</h1>
    </div>

    <div class="topbar__controls">
      <div class="field">
        <label for="year-select">연도</label>
        <select id="year-select">
          <option value="2021">2021</option>
          <option value="2022">2022</option>
        </select>
      </div>
      <div class="field">
        <label for="disease-select">질병</label>
        <select id="disease-select"></select>
      </div>
      <div class="field field--slider">
        <label for="tilt-slider">기울기</label>
        <input type="range" id="tilt-slider" min="-20" max="20" value="0" step="1" />
      </div>
      <div class="field field--slider">
        <label for="height-slider">최대 돌출 높이 <span id="height-value">42</span></label>
        <input type="range" id="height-slider" min="5" max="120" value="42" step="1" />
      </div>
    </div>
  </header>

  <p class="data-note">
    ※ 전남·광주는 이 데이터셋 자체가 통합값만 제공하여 두 지역에 같은 값을 표시합니다. 지도 경계는 연도별 과거
    시점이 아닌 admdongkor의 최신 행정구역 경계 하나를 기준으로 그렸습니다.
  </p>

  <main class="stage">
    <div id="canvas-host"></div>
    <div id="labels-layer"></div>

    <div id="loading" class="loading">
      <div class="loading__bar"><div class="loading__fill"></div></div>
      <p>시도 경계 데이터를 가져오는 중…</p>
    </div>

    <div id="error-panel" class="error-panel hidden">
      <p class="error-panel__title">지도를 불러오지 못했습니다</p>
      <p class="error-panel__body"></p>
    </div>

    <aside class="hud">
      <div class="hud__stat">
        <span class="hud__label">전국 합계</span>
        <span class="hud__value" id="total-value">–</span>
        <span class="hud__unit">건</span>
      </div>
      <div class="hud__legend">
        <span class="hud__label">발생 건수</span>
        <div class="legend-bar" id="legend-bar"></div>
        <div class="legend-scale">
          <span id="legend-min">0</span>
          <span id="legend-max">–</span>
        </div>
      </div>
      <p class="hud__hint">드래그: 이동 · 휠: 확대·축소 · 기울기 슬라이더: 살짝 회전</p>
    </aside>

    <div id="tooltip" class="tooltip hidden">
      <span class="tooltip__name"></span>
      <span class="tooltip__value"></span>
      <span class="tooltip__note"></span>
    </div>
  </main>

  <footer class="footer">
    <span>경계 데이터: admdongkor (vuski) — 통계청 SGIS 기반, 공공누리 제1유형</span>
  </footer>

  <script type="module" src="index.js"></script>
</body>
</html>
